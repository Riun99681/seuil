  function down(e){
    if(fini)return;e.preventDefault();audioStart();
    if(t)return;
    t=setInterval(function(){p+=3.2;f.style.width=Math.min(p,100)+"%";if(p>=100)finir();},16);
  }
  function up(){if(fini||!t)return;clearInterval(t);t=null;finir();}
  b.addEventListener("pointerdown",down);
  b.addEventListener("keydown",function(e){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();audioStart();finir();}});
  window.addEventListener("pointerup",up);
  window.addEventListener("pointercancel",up);
}
function ouvrir(){
  GLOW.classList.add("on");toc();
  clear();
  T(function(){L1.innerHTML="Bonsoir.";L1.classList.add("in");},900);
  T(function(){L2.innerHTML="Vous êtes entré.";L2.classList.add("in");},3800);
  T(function(){L2.classList.remove("in");},7200);
  T(function(){L2.innerHTML="Il n'y a rien à acheter ici.";L2.classList.add("in");},8800);
  T(accueil,13000);
}
function accueil(){
  dis("Qu'est-ce que vous cherchez ?","",function(){
    T(function(){
      dis("Quelque chose vous a amené ici.","",function(){
        choix([["un manque","manque"],["une curiosité","curiosite"],["quelqu'un d'autre","autre"],["rien de précis","rien"]],q2);
      });
    },500);
  });
}
function q2(k){var s=Q2[k];dis(s.p,"",function(){choix(s.o,function(th){theme=th;ecrire();});});}
function ecrire(){
  salle(0,.5);fond(.012,1.5);clear();
  T(function(){
    L1.innerHTML="Maintenant, dites-le.";L1.classList.add("in");
    L2.innerHTML="Finissez la phrase. Une ligne, même maladroite. Plus vous êtes sincère, plus vous risquez d'être conduit vers ce qui vous concerne vraiment — et tant qu'elle n'est pas écrite, elle reste vague. Ce n'est pas un formulaire : personne ne la lira.";
    L2.classList.add("in");
    var row=document.createElement("div");row.id="sx-amorce";
    var pre=document.createElement("span");pre.id="sx-prefixe";pre.textContent="Ce que je cherche, c'est";
    var i=document.createElement("input");i.id="sx-champ";i.type="text";
    i.setAttribute("aria-label","finissez la phrase : ce que je cherche, c'est");
    row.appendChild(pre);row.appendChild(i);
    var e=document.createElement("p");e.id="sx-err";
    var v=document.createElement("button");v.type="button";v.className="sx-mot";v.textContent="c'est écrit";
    v.style.marginTop="1.4rem";
    MOTS.appendChild(row);MOTS.appendChild(e);MOTS.appendChild(v);
    T(function(){i.focus();},400);
    function suite(){
      if(i.value.trim().length<4){e.textContent="allez jusqu'au bout de la phrase";i.focus();return;}
      ecrit=i.value.trim();toc();salle(.030,3);fond(.045,3);q3();
    }
    i.addEventListener("input",function(){
      e.textContent="";
      if(i.value.trim().length>=4)v.classList.add("in");else v.classList.remove("in");
    });
    i.addEventListener("keydown",function(ev){if(ev.key==="Enter"){ev.preventDefault();suite();}});
    v.addEventListener("click",suite);
  },900);
}
function q3(){
  var s=Q3[theme]||Q3.rien;
  dis(s.p,"",function(){choix(s.o,function(k){envers(k);});});
}
function envers(k){
  salle(0,2);fond(.02,2);GLOW.classList.remove("on");clear();
  T(function(){
    L1.innerHTML="Avant d'aller plus loin.";L1.classList.add("in");
    L2.innerHTML="Rien de ce qui est proposé ici ne réglera quoi que ce soit à votre place. Un atelier est un outil. Un stage est un outil. Une intervention en entreprise est un outil.<br><br>Un outil au service de quoi, au fait ?";
    L2.classList.add("in");
  },400);
  T(function(){choix([["je continue","go"]],function(){salle(.022,3);fond(.045,3);sortie(k);});},5200);
}
function sortie(k){
  var s=SORTIES[k];clear();GLOW.classList.add("on");
  try{localStorage.setItem("seuil-passe","1");}catch(e){}
  T(function(){L1.innerHTML=s.p;L1.classList.add("in");},300);
  T(function(){
    var e=document.createElement("p");e.className="sx-envers";e.textContent=s.e;
    var a=document.createElement("a");a.id="sx-sortie";a.textContent=s.d;
    a.href=s.u;
    var sg=document.createElement("p");sg.id="sx-signature";
    sg.innerHTML="vous êtes passé par : "+trace.join(" · ")+
      "<br>vous avez écrit : ce que je cherche, c'est "+ecrit.replace(/</g,"&lt;")+
      "<br><br>Vous n'avez peut-être pas trouvé. Vous avez cherché.<br>C'est déjà quelque chose que vous savez de vous.";
    var r=document.createElement("button");r.id="sx-reprendre";r.type="button";r.textContent="recommencer";
    r.onclick=function(){stopT();vitrine();};
    MOTS.appendChild(e);MOTS.appendChild(a);MOTS.appendChild(sg);MOTS.appendChild(r);
    T(function(){e.classList.add("in");a.classList.add("in");sg.classList.add("in");r.classList.add("in");},60);
  },900);
}
function demarrer(){
  L1=document.getElementById("sx-l1");L2=document.getElementById("sx-l2");
  MOTS=document.getElementById("sx-mots");TRACE=document.getElementById("sx-trace");
  PORTE=document.getElementById("sx-porte");GLOW=document.getElementById("sx-glow");
  vitrine();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",demarrer);
else demarrer();
})();
